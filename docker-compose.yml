services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmclone
      POSTGRES_PASSWORD: cmclone
      POSTGRES_DB: cmclone
    ports:
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmclone -d cmclone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
